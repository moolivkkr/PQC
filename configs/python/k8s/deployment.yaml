apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/orders@sha256:<digest>
          ports:
            - containerPort: 8443
          env:
            - name: OPENSSL_CONF          # AL2023-based image only; trixie/alpine need nothing
              value: /etc/pq-tls/openssl-pq.cnf
          readinessProbe:
            tcpSocket: {port: 8443}
