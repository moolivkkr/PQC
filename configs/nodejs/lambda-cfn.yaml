AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  CodeBucket: { Type: String }
  CodeKey: { Type: String }
  RoleArn: { Type: String }
Resources:
  OrdersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !Ref RoleArn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          OPENSSL_CONF: /var/task/pq-tls/openssl-pq-node.cnf
