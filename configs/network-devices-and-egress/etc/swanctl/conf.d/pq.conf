# /etc/swanctl/conf.d/pq.conf - IKEv2 hybrid X25519 + ML-KEM-768 (RFC 9370), strongSwan 6.0.2+ with OpenSSL 3.5
connections {
  pq {
    version = 2
    local_addrs  = LOCAL
    remote_addrs = REMOTE
    # Hybrid: classical x25519 in IKE_SA_INIT, ML-KEM-768 in IKE_INTERMEDIATE.
    # Drop "-ke1_none" to REQUIRE ML-KEM (no classical fallback).
    proposals = aes256gcm16-prfsha384-x25519-ke1_mlkem768-ke1_none
    local {
      auth = psk
      id = LOCAL
    }
    remote {
      auth = psk
      id = REMOTE
    }
    children {
      net {
        local_ts  = LOCAL/32
        remote_ts = REMOTE/32
        esp_proposals = aes256gcm16-x25519-ke1_mlkem768-ke1_none
        mode = transport
        start_action = none
      }
    }
  }
}
secrets {
  ike-pq {
    secret = "lab-only-psk-change-me"
  }
}
