# /etc/nginx/conf.d/default.conf - serve an ML-DSA chain to clients that offer ML-DSA
# signature algorithms, and an ECDSA chain to everyone else. Needs nginx linked to OpenSSL 3.5+.
server {
    listen 443 ssl;
    server_name web;

    # Order does not matter: OpenSSL picks the certificate whose key matches a
    # signature algorithm the client offered (signature_algorithms extension).
    ssl_certificate     /etc/nginx/pki/mldsa-fullchain.crt;
    ssl_certificate_key /etc/nginx/pki/mldsa-leaf.key;
    ssl_certificate     /etc/nginx/pki/ec-fullchain.crt;
    ssl_certificate_key /etc/nginx/pki/ec-leaf.key;

    ssl_protocols   TLSv1.3 TLSv1.2;
    ssl_ecdh_curve  X25519MLKEM768:X25519:prime256v1;

    location / {
        return 200 "ok $ssl_protocol $ssl_curve\n";
    }
}
