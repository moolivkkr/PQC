# envoy-egress.yaml - egress gateway: apps send plain HTTP (or HTTPS to a sidecar) inside the VPC,
# Envoy originates TLS 1.3 with hybrid ML-KEM to the external service.
# Tested: Envoy 1.40.x (BoringSSL). On Envoy >= 1.40 X25519MLKEM768 is in the default curves;
# setting ecdh_curves explicitly also works on older BoringSSL builds that know the name.
static_resources:
  listeners:
  - name: egress_http
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "[%START_TIME%] %REQ(:AUTHORITY)% %RESPONSE_CODE% upstream_tls=%UPSTREAM_TLS_VERSION% upstream_group=%UPSTREAM_TLS_GROUP%\n"
          route_config:
            virtual_hosts:
            - name: partner
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: partner_api }
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
  - name: partner_api
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: partner_api
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: origin, port_value: 4433 } } }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: origin
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_2
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: [X25519MLKEM768, X25519, P-256]
          validation_context:
            trusted_ca: { filename: /certs/origin-ca.pem }
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: origin }
