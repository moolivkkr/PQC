events {}
http {
  log_format pq '$remote_addr "$request" $status proto=$ssl_protocol group=$ssl_curve ua="$http_user_agent"';
  access_log /dev/stdout pq;
  # PQ-only listener: TLS 1.3 + X25519MLKEM768 only.
  server {
    listen 8443 ssl;
    ssl_certificate /c/srv.crt;
    ssl_certificate_key /c/srv.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    location / { return 200 "ok\n"; }
  }
  # Classical-only listener: X25519 only.
  server {
    listen 8444 ssl;
    ssl_certificate /c/srv.crt;
    ssl_certificate_key /c/srv.key;
    ssl_ecdh_curve X25519;
    location / { return 200 "ok\n"; }
  }
}
