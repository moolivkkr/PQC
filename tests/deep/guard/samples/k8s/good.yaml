apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-good
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:111122223333:certificate/x
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: v1
kind: Service
metadata:
  name: nlb-good
  namespace: app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:eu-west-1:111122223333:certificate/x
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
spec:
  type: LoadBalancer
  selector: { app: web }
  ports: [ { port: 443, targetPort: 8080 } ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ecdh-curve: "X25519MLKEM768:X25519:prime256v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod
  namespace: istio-system
  labels: { app: istiod }
spec:
  selector: { matchLabels: { app: istiod } }
  template:
    metadata: { labels: { app: istiod } }
    spec:
      containers:
        - name: discovery
          image: docker.io/istio/pilot:1.27.3
          env:
            - { name: COMPLIANCE_POLICY, value: pqc }
---
apiVersion: v1
kind: Pod
metadata:
  name: go-api
  namespace: app
spec:
  containers:
    - name: api
      image: example/api:1
      env:
        - { name: GODEBUG, value: "http2client=1" }
        - { name: OPENSSL_CONF, value: /etc/pq-tls/openssl-pq.cnf }
