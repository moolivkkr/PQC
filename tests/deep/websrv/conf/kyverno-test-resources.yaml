apiVersion: v1
kind: ConfigMap
metadata: { name: ingress-nginx-controller, namespace: ingress-nginx }
data:
  ssl-ecdh-curve: "X25519MLKEM768:X25519:prime256v1"
  ssl-protocols: "TLSv1.2 TLSv1.3"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: ingress-nginx-controller, namespace: ingress-nginx-legacy }
data:
  ssl-ecdh-curve: "X25519:prime256v1"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: { name: pq-good, namespace: default }
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: eg }]
  tls: { minVersion: "1.3", ecdhCurves: [X25519MLKEM768, X25519] }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata: { name: pq-missing, namespace: default }
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: eg }]
  tls: { minVersion: "1.2" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: istiod, namespace: istio-system, labels: { app: istiod } }
spec:
  selector: { matchLabels: { app: istiod } }
  template:
    metadata: { labels: { app: istiod } }
    spec:
      containers:
      - name: discovery
        image: docker.io/istio/pilot:1.28.0
        env: [{ name: COMPLIANCE_POLICY, value: pqc }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: ztunnel, namespace: istio-system }
spec:
  selector: { matchLabels: { app: ztunnel } }
  template:
    metadata: { labels: { app: ztunnel } }
    spec:
      containers:
      - name: istio-proxy
        image: docker.io/istio/ztunnel:1.28.0
        env: [{ name: CA_ADDRESS, value: "istiod.istio-system.svc:15012" }]
